<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>.</title>

<style id="base">
body {
  margin: 0;
  background: #111;
  display: flex;
  justify-content: center;
}

#gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  width: 100%;
  padding: 10px;
}

img {
  width: 100%;
  border-radius: 12px;
}
</style>
</head>

<body>

<div id="gallery"></div>

<script>
function load() {
  const params = new URLSearchParams(location.search);
  const data = params.get("data");

  if (!data) return;

  let state;
  try {
    state = JSON.parse(atob(data));
  } catch {
    return;
  }

  if (state.css) {
    document.getElementById("base").textContent += "\n" + state.css;
  }

  const g = document.getElementById("gallery");

  (state.imgs || []).forEach(url => {
    const img = document.createElement("img");
    img.src = url;
    g.appendChild(img);
  });
}

load();
</script>

</body>
</html>
