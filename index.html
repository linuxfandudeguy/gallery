<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Embed Gallery</title>

<style id="core-style">
body {
  margin: 0;
  font-family: system-ui;
  background: #111;
  color: white;
}

#toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  background: #1a1a1a;
  position: sticky;
  top: 0;
}

body.embed #toolbar {
  display: none;
}

button, input {
  padding: 8px;
  border-radius: 8px;
  border: none;
}

button {
  cursor: pointer;
}

#gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 10px;
  padding: 10px;
}

img {
  width: 100%;
  border-radius: 12px;
  object-fit: cover;
}
</style>
</head>

<body>

<div id="toolbar">
  <input type="file" id="file" multiple />
  <button onclick="upload()">Upload</button>
  <button onclick="addURL()">Add URL</button>
  <button onclick="editCSS()">CSS</button>
  <button onclick="exportState()">Export Embed</button>
</div>

<div id="gallery"></div>

<script>
const CLIENT_ID = "b4fb95e0edc434c";

let state = {
  v: 1,
  imgs: [],
  css: "",
  layout: "grid"
};

// ------------------------
// LOAD
// ------------------------
function load() {
  const p = new URLSearchParams(location.search);
  const data = p.get("data");

  if (data) {
    document.body.classList.add("embed");

    try {
      state = JSON.parse(atob(data));
    } catch (e) {
      console.warn("Invalid data payload");
    }
  }

  applyCSS();
  render();
}

// ------------------------
// APPLY CSS
// ------------------------
function applyCSS() {
  if (!state.css) return;
  document.getElementById("core-style").textContent += "\n" + state.css;
}

// ------------------------
// RENDER
// ------------------------
function render() {
  const g = document.getElementById("gallery");
  g.innerHTML = "";

  state.imgs.forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    g.appendChild(img);
  });
}

// ------------------------
// UPLOAD
// ------------------------
async function upload() {
  const files = document.getElementById("file").files;

  for (let f of files) {
    const form = new FormData();
    form.append("image", f);

    const res = await fetch("https://api.imgur.com/3/image", {
      method: "POST",
      headers: {
        Authorization: "Client-ID " + CLIENT_ID
      },
      body: form
    });

    const json = await res.json();

    if (json.success) {
      state.imgs.push(json.data.link);
    }
  }

  render();
}

// ------------------------
// ADD URL
// ------------------------
function addURL() {
  const url = prompt("Image URL:");
  if (!url) return;
  state.imgs.push(url);
  render();
}

// ------------------------
// EDIT CSS
// ------------------------
function editCSS() {
  const css = prompt("Enter CSS:", state.css || "");
  if (css === null) return;

  state.css = css;
  location.reload();
}

// ------------------------
// EXPORT
// ------------------------
function exportState() {
  const encoded = btoa(JSON.stringify(state));

  const url =
    location.origin +
    location.pathname +
    "?data=" +
    encoded;

  navigator.clipboard.writeText(url);
  alert("Embed link copied!");
}

// INIT
load();
</script>

</body>
</html>
